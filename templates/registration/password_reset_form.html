{% extends "base.html" %}

{% block title %}Reset your password — LexImmigrate{% endblock %}

{% block content %}
<section>
  <div class="wrap auth-wrap">
    <span class="eyebrow">Password reset</span>
    <h2>Forgot your password?</h2>
    <p class="auth-lead">Enter your email and we'll send you a link to set a new one.</p>
    <div class="auth-card">
      <form method="post">
        {% csrf_token %}
        <div class="field"><label for="id_email">Email</label>{{ form.email }}{{ form.email.errors }}</div>
        <button type="submit" class="btn btn-primary btn-lg" style="width:100%;justify-content:center">Send reset link</button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
