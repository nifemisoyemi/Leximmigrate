{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}My case — LexImmigrate{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body class="app-body">

<header class="app-topbar">
  <div style="display:flex;align-items:center">
    <button class="side-toggle" id="sideToggle" aria-label="Show or hide menu">☰</button>
    <a class="logo" href="{% url 'portal:dashboard' %}">Lex<b>Immigrate</b></a>
  </div>
  <div class="app-topbar-right">
    <a href="{% url 'portal:appointments' %}" class="btn btn-ghost btn-sm">Schedule attorney time</a>
    <form method="post" action="{% url 'logout' %}">{% csrf_token %}
      <button type="submit" class="lang" style="cursor:pointer;font-family:inherit">Log out</button>
    </form>
  </div>
</header>

<div class="app-shell">
  <aside class="app-side">
    <nav aria-label="Portal">
      <a class="side-link{% if active == 'case' %} on{% endif %}" href="{% url 'portal:dashboard' %}" title="Your Case">
        <span class="side-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 22V4a2 2 0 0 1 2-2h12l2 3-2 3H6"/><path d="M4 14h12l2 3-2 3H4"/></svg></span>
        <span class="side-label">Your Case</span>
      </a>
      <a class="side-link{% if active == 'documents' %} on{% endif %}" href="{% url 'portal:documents' %}" title="Documents">
        <span class="side-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h8"/></svg></span>
        <span class="side-label">Documents</span>
      </a>
      <a class="side-link{% if active == 'appointments' %} on{% endif %}" href="{% url 'portal:appointments' %}" title="Appointments">
        <span class="side-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></span>
        <span class="side-label">Appointments</span>
      </a>
      <a class="side-link{% if active == 'resources' %} on{% endif %}" href="{% url 'portal:resources' %}" title="Study Resources">
        <span class="side-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span>
        <span class="side-label">Study Resources</span>
      </a>
      <a class="side-link{% if active == 'help' %} on{% endif %}" href="{% url 'portal:help' %}" title="Get Help">
        <span class="side-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg></span>
        <span class="side-label">Get Help</span>
      </a>
    </nav>
    <div class="side-foot">
      <a href="{% url 'home' %}">← Back to main site</a>
    </div>
  </aside>

  <main class="app-main">
    {% block portal %}{% endblock %}
  </main>
</div>

<script>
  (function () {
    var shell = document.querySelector('.app-shell');
    var key = 'lex-side-collapsed';
    if (localStorage.getItem(key) === '1') shell.classList.add('collapsed');
    document.getElementById('sideToggle').addEventListener('click', function () {
      shell.classList.toggle('collapsed');
      localStorage.setItem(key, shell.classList.contains('collapsed') ? '1' : '0');
    });
  })();
</script>

</body>
</html>
