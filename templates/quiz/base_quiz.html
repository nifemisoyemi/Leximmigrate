{% extends "base.html" %}

{% block content %}
<style>
  .quiz-wrap{max-width:640px;margin:0 auto;padding:56px 24px 90px}
  .quiz-progress{height:6px;background:var(--line);border-radius:999px;overflow:hidden;margin-bottom:30px}
  .quiz-progress span{display:block;height:100%;background:var(--brand);transition:width .3s ease}
  .quiz-step{font-size:.8rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--brand);margin-bottom:10px}
  .quiz-q{font-family:"Fraunces",serif;font-size:1.8rem;line-height:1.15;margin-bottom:8px}
  .quiz-help{color:var(--muted);margin-bottom:26px}
  .quiz-options{display:flex;flex-direction:column;gap:12px;margin-bottom:28px}
  .opt{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:12px;padding:15px 18px;cursor:pointer;background:var(--paper-2);transition:border-color .15s,background .15s}
  .opt:hover{border-color:var(--brand);background:var(--sky)}
  .opt input{accent-color:var(--brand);width:18px;height:18px;flex-shrink:0}
  .opt span{font-size:1.02rem}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
  .field label{font-weight:600;font-size:.95rem}
  .field input{border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;font-size:1rem;font-family:inherit;background:var(--paper-2)}
  .field input:focus{outline:none;border-color:var(--brand)}
  .quiz-err{color:#b4231f;font-size:.92rem;margin-bottom:14px}
  .quiz-actions{display:flex;justify-content:flex-end;margin-top:6px}
  .result-card{background:var(--paper-2);border:1px solid var(--line);border-radius:16px;padding:40px 34px;text-align:center;box-shadow:0 18px 40px -28px rgba(18,40,59,.4)}
  .result-card h1{font-family:"Fraunces",serif;font-size:2rem;margin:6px 0 14px}
  .result-card p{color:var(--muted);margin-bottom:12px}
  .rec-tier{display:inline-block;background:var(--honey-soft);color:#5a3d0c;font-weight:700;border-radius:999px;padding:.45rem 1.1rem;margin:8px 0 4px;font-size:1.05rem}
</style>
<div class="quiz-wrap">
  {% block quiz %}{% endblock %}
</div>
{% endblock %}
